<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Shake – Weeknd</title>
<style>
  :root { color-scheme: dark; }
  html, body { height: 100%; margin: 0; background: #151515; overflow: hidden; }
  body { display: grid; place-items: center; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }

  .stage {
    --ar: 1;
    position: relative;
    width: min(100vw, calc(100dvh * var(--ar)));
    aspect-ratio: var(--ar);
    overflow: hidden;
    touch-action: none;
    -webkit-tap-highlight-color: transparent;
    -webkit-touch-callout: none;
    user-select: none;
  }
  .layer {
    position: absolute;
    left: 0; top: 0; width: 100%; height: 100%;
    object-fit: fill;
    will-change: transform;
    pointer-events: none;
    user-select: none;
    -webkit-user-drag: none;
  }

  /* eye layers: a static clipped window (keeps each eye apart) with the eye artwork sliding inside it */
  .eyewrap { overflow: visible; }
  .eyewrap > img {
    position: absolute; left: 0; top: 0; width: 100%; height: 100%;
    will-change: transform; pointer-events: none; user-select: none; -webkit-user-drag: none;
  }

  .ui {
    position: absolute; left: 0; right: 0; bottom: max(16px, env(safe-area-inset-bottom));
    display: flex; flex-direction: column; align-items: center; gap: 8px;
    pointer-events: none;
  }
  button#enable {
    pointer-events: auto;
    font-weight: 600; font-size: 15px; line-height: 1; font-family: inherit;
    padding: 12px 20px; border-radius: 999px; border: 0;
    background: #f2f2f2; color: #151515; cursor: pointer;
  }
  button#enable:focus-visible { outline: 3px solid #7fb4ff; outline-offset: 3px; }
  .hint {
    font-size: 13px; color: #fff; background: rgba(0,0,0,.55);
    padding: 6px 12px; border-radius: 999px;
    transition: opacity .6s ease;
  }
  .hidden { display: none !important; }
  .fade { opacity: 0; }

  /* ---- Tour sheet (long press) ---- */
  .sheet {
    position: fixed; left: 50%; bottom: 0; z-index: 20;
    width: min(100vw, 520px); max-height: 80dvh; overflow: auto; overscroll-behavior: contain;
    box-sizing: border-box; padding: 22px 20px max(22px, env(safe-area-inset-bottom));
    background: rgba(18, 18, 20, .93);
    -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px);
    border-top: 2px solid #e0445a; border-radius: 20px 20px 0 0;
    color: #f1eded;
    transform: translate(-50%, 105%);
    transition: transform .45s cubic-bezier(.2,.8,.2,1);
    box-shadow: 0 -10px 40px rgba(224, 68, 90, .18);
  }
  .sheet.open { transform: translate(-50%, 0); }
  .sheet .close {
    position: absolute; top: 10px; right: 12px; width: 36px; height: 36px;
    border: 0; border-radius: 50%; background: rgba(255,255,255,.1); color: #fff;
    font-size: 20px; line-height: 1; cursor: pointer;
  }
  .sheet .close:focus-visible { outline: 3px solid #7fb4ff; outline-offset: 2px; }
  .kicker { font-size: 12px; letter-spacing: .2em; color: #e0445a; text-transform: uppercase; }
  .sheet h2 { margin: 6px 40px 0 0; font-size: 22px; font-weight: 700; line-height: 1.2; }
  .sub { font-size: 14px; color: #b9aeb0; margin-top: 2px; }
  .banner { margin-top: 14px; padding: 10px 12px; border-radius: 12px; font-size: 14px; line-height: 1.4;
    background: rgba(224, 68, 90, .12); border: 1px solid rgba(224, 68, 90, .4); }
  .banner b { color: #ff8da0; }
  .legs { margin-top: 8px; }
  .legs h3 { margin: 18px 0 6px; font-size: 12px; letter-spacing: .16em; text-transform: uppercase; color: #ff8da0; font-weight: 600; }
  .stop { display: grid; grid-template-columns: 112px 1fr; gap: 4px 12px; padding: 10px 0; border-top: 1px solid rgba(255,255,255,.09); }
  .stop .d { font-size: 15px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .stop .c { font-size: 15px; font-weight: 600; }
  .stop .v { grid-column: 2; font-size: 12px; color: #b9aeb0; margin-top: -2px; }
  .stop.done { opacity: .45; }
  .stop.next { opacity: 1; border-left: 3px solid #ff9a2e; padding-left: 9px; margin-left: -12px; background: rgba(255,154,46,.1); }
  .stop.next .d::after { content: " \00B7  next"; color: #ffb35c; font-weight: 600; font-size: 12px; }
  .note { margin: 16px 0 0; font-size: 11px; line-height: 1.5; color: #8d8386; }

  /* tabs + clickable stops in the schedule */
  .tabs { display: flex; gap: 6px; margin-top: 14px; }
  .tabs button { flex: 1; font: inherit; font-size: 13px; padding: 9px 8px; border-radius: 999px; border: 1px solid rgba(224,68,90,.5); background: transparent; color: #e7dcde; cursor: pointer; }
  .tabs button[aria-selected="true"] { background: #e0445a; border-color: #e0445a; color: #fff; font-weight: 700; }
  .tabs button:focus-visible, button.stop:focus-visible { outline: 3px solid #7fb4ff; outline-offset: 2px; }
  button.stop { grid-template-columns: 112px 1fr auto; width: 100%; border: 0; border-top: 1px solid rgba(255,255,255,.09); background: transparent; font: inherit; color: inherit; text-align: left; cursor: pointer; }
  button.stop:hover { background: rgba(224,68,90,.08); }
  .stop .go { grid-column: 3; grid-row: 1 / span 2; align-self: center; font-size: 12px; font-weight: 700; padding: 7px 12px; border-radius: 999px; background: #e0445a; color: #fff; white-space: nowrap; }

  /* ---- Encore ticket mockup ---- */
  .booking {
    position: fixed; inset: 0; z-index: 30; overflow: auto; overscroll-behavior: contain; touch-action: manipulation;
    background: linear-gradient(180deg, #1a1218, #0d0b0e); color: #f1eded;
    visibility: hidden; opacity: 0; transform: translateY(24px);
    transition: opacity .3s, transform .3s, visibility 0s .3s;
  }
  .booking.open { visibility: visible; opacity: 1; transform: none; transition: opacity .3s, transform .3s; }
  .bk-wrap { max-width: 520px; min-height: 100%; margin: 0 auto; display: flex; flex-direction: column; }
  .bk-head { position: sticky; top: 0; z-index: 3; display: flex; align-items: center; gap: 10px; padding: max(12px, env(safe-area-inset-top)) 14px 12px; background: rgba(18, 16, 20, .97); border-bottom: 1px solid rgba(224,68,90,.35); }
  .bk-head .ttl { flex: 1; min-width: 0; }
  .bk-head .ttl div { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .bk-head .kicker { font-size: 11px; }
  #bkVenue { font-size: 16px; font-weight: 700; }
  #bkWhen { font-size: 13px; color: #ffb35c; }
  .bk-round { flex: 0 0 auto; width: 40px; height: 40px; border: 0; border-radius: 50%; background: rgba(255,255,255,.1); color: #fff; font-size: 20px; line-height: 1; cursor: pointer; }
  .bk-round[hidden] { display: none; }
  .bk-round:focus-visible, .bk-primary:focus-visible, .seat:focus-visible, .bk-step-btn:focus-visible, .bk-opt:focus-visible, .bk-ghost:focus-visible, .zone:focus-visible { outline: 3px solid #7fb4ff; outline-offset: 2px; }
  .bk-steps { display: flex; gap: 6px; padding: 12px 16px 0; margin: 0; list-style: none; }
  .bk-steps li { flex: 1; text-align: center; font-size: 12px; color: #8d8386; padding-bottom: 6px; border-bottom: 3px solid rgba(255,255,255,.12); }
  .bk-steps li.on { color: #fff; border-color: #e0445a; font-weight: 700; }
  .bk-steps li.done { color: #ffb35c; border-color: #ff9a2e; }
  .bk-body { padding: 18px 16px 24px; flex: 1; }
  .bk-h { margin: 18px 0 8px; font-size: 18px; }
  .bk-h:first-child { margin-top: 0; }
  .bk-msg { margin-bottom: 14px; padding: 10px 12px; border-radius: 12px; font-size: 13px; background: rgba(255,154,46,.14); border: 1px solid rgba(255,154,46,.5); }
  .bk-hold { margin-bottom: 14px; padding: 8px 12px; border-radius: 12px; font-size: 13px; background: rgba(224,68,90,.12); border: 1px solid rgba(224,68,90,.4); font-variant-numeric: tabular-nums; }
  .bk-hold.low { background: rgba(255,154,46,.14); border-color: rgba(255,154,46,.6); }
  .bk-demo { margin: 0 0 14px; padding: 10px 12px; border-radius: 12px; font-size: 12px; line-height: 1.5; color: #e7dcde; background: rgba(255,255,255,.06); border: 1px dashed rgba(255,255,255,.3); }
  .bk-foot { position: sticky; bottom: 0; z-index: 3; display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 12px 16px max(14px, env(safe-area-inset-bottom)); background: rgba(18, 16, 20, .97); border-top: 1px solid rgba(224,68,90,.35); }
  .bk-sum b { display: block; font-size: 20px; font-variant-numeric: tabular-nums; }
  .bk-sum span { font-size: 12px; color: #b9aeb0; }
  .bk-primary { margin-left: auto; border: 0; border-radius: 999px; padding: 13px 22px; font: inherit; font-size: 16px; font-weight: 700; background: #ff9a2e; color: #1a0f00; cursor: pointer; }
  .bk-primary:disabled { opacity: .35; cursor: not-allowed; }
  .bk-opt { display: flex; align-items: center; gap: 10px; width: 100%; text-align: left; font: inherit; color: inherit; padding: 12px; margin-top: 8px; border-radius: 12px; border: 1px solid rgba(255,255,255,.2); background: transparent; cursor: pointer; }
  .bk-opt:disabled { opacity: .35; cursor: not-allowed; }
  .bk-opt .dot { flex: 0 0 auto; width: 16px; height: 16px; border-radius: 50%; border: 2px solid rgba(255,255,255,.5); }
  .bk-opt .box { flex: 0 0 auto; width: 16px; height: 16px; border-radius: 4px; border: 2px solid rgba(255,255,255,.5); }
  .bk-opt[aria-checked="true"] { border-color: #e0445a; background: rgba(224,68,90,.12); }
  .bk-opt[aria-checked="true"] .dot { border-color: #e0445a; background: radial-gradient(circle, #e0445a 45%, transparent 50%); }
  .bk-opt[aria-checked="true"] .box { border-color: #e0445a; background: #e0445a; }
  .bk-opt .main { flex: 1; min-width: 0; }
  .bk-opt small { display: block; color: #b9aeb0; font-size: 12px; }
  .bk-opt .amt { font-variant-numeric: tabular-nums; color: #ffb35c; font-size: 14px; }
  .bk-stepper { display: flex; align-items: center; justify-content: center; gap: 22px; padding: 6px 0; }
  .bk-step-btn { width: 48px; height: 48px; border-radius: 50%; border: 1px solid rgba(224,68,90,.7); background: rgba(224,68,90,.12); color: #fff; font-size: 24px; line-height: 1; cursor: pointer; }
  .bk-step-btn:disabled { opacity: .3; cursor: not-allowed; }
  .bk-count { min-width: 34px; text-align: center; font-size: 30px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .bk-ghost { font: inherit; font-size: 13px; padding: 9px 14px; border-radius: 999px; border: 1px solid rgba(224,68,90,.6); background: transparent; color: #e7dcde; cursor: pointer; }
  /* venue map */
  .venuemap { width: 100%; height: auto; display: block; margin-top: 4px; }
  .zone { cursor: pointer; }
  .zone rect { stroke: rgba(255,255,255,.35); stroke-width: 1; transition: filter .15s; }
  .zone text { fill: #fff; font-size: 9px; font-weight: 700; text-anchor: middle; dominant-baseline: central; pointer-events: none; }
  .zone.pit rect { fill: #e0445a; } .zone.floor rect { fill: #b73a63; } .zone.lower rect { fill: #84305f; } .zone.upper rect { fill: #4e3162; }
  .zone:hover rect { filter: brightness(1.25); }
  .zone.sel rect { stroke: #ff9a2e; stroke-width: 3; filter: brightness(1.3); }
  .zone.na { cursor: not-allowed; opacity: .3; }
  .zone.na:hover rect { filter: none; }
  .zone.na rect { fill: #3a3338 !important; }
  .stagebox { fill: #f1eded; opacity: .9; }
  .stagelbl { fill: #1a1218; font-size: 10px; font-weight: 800; letter-spacing: .2em; text-anchor: middle; dominant-baseline: central; }
  .tierkey { display: flex; flex-wrap: wrap; gap: 8px 14px; margin-top: 10px; font-size: 12px; color: #b9aeb0; }
  .tierkey i { display: inline-block; width: 12px; height: 12px; border-radius: 3px; margin-right: 6px; vertical-align: -1px; }
  .panel { margin-top: 14px; padding: 14px; border-radius: 14px; background: rgba(255,255,255,.05); border: 1px solid rgba(224,68,90,.35); min-height: 70px; }
  .panel .pt { font-size: 17px; font-weight: 700; }
  .panel .ps { font-size: 13px; color: #b9aeb0; margin-top: 2px; }
  .panel .pp { font-size: 15px; color: #ffb35c; margin-top: 6px; font-variant-numeric: tabular-nums; }
  .panel .low { color: #ff9a2e; font-weight: 700; }
  .seatgrid { display: grid; gap: 4px; margin-top: 12px; }
  .seat { width: 100%; max-width: 24px; aspect-ratio: 1 / 1; justify-self: center; padding: 0; position: relative; border-radius: 5px 5px 3px 3px; border: 1.5px solid rgba(255,140,165,.8); background: rgba(224,68,90,.15); color: #1a0f00; font-size: 10px; font-weight: 700; cursor: pointer; }
  .seat[aria-pressed="true"] { background: #ff9a2e; border-color: #ffb35c; }
  .seat[aria-pressed="true"]::after { content: "\2713"; }
  .seat:disabled { border-color: rgba(255,255,255,.12); background: rgba(255,255,255,.06); cursor: not-allowed; }
  .seat:disabled::after { content: "\00D7"; color: rgba(255,255,255,.35); }
  .bk-picked { margin-top: 10px; text-align: center; font-size: 14px; font-weight: 600; color: #ffb35c; min-height: 1.4em; }
  .rowhint { text-align: center; font-size: 11px; letter-spacing: .2em; color: #8d8386; margin-top: 12px; }
  /* review + ticket */
  .bk-card { padding: 14px; border-radius: 14px; background: rgba(255,255,255,.05); border: 1px solid rgba(224,68,90,.3); margin-bottom: 14px; }
  .bk-card h4 { margin: 0 0 8px; font-size: 12px; letter-spacing: .14em; text-transform: uppercase; color: #ff8da0; font-weight: 600; }
  .bk-kv { display: flex; justify-content: space-between; gap: 12px; padding: 4px 0; font-size: 14px; }
  .bk-kv span:first-child { color: #b9aeb0; }
  .bk-kv span:last-child { text-align: right; font-variant-numeric: tabular-nums; }
  .bk-kv.total { margin-top: 6px; padding-top: 10px; border-top: 1px solid rgba(255,255,255,.15); font-size: 17px; font-weight: 700; }
  .bk-kv.total span:first-child { color: #fff; }
  .bk-ok { text-align: center; font-size: 20px; font-weight: 700; color: #7be0a5; margin-bottom: 4px; }
  .bk-okja { text-align: center; font-size: 13px; color: #b9aeb0; margin-bottom: 16px; }
  .bk-ticket { display: grid; grid-template-columns: 1fr auto; gap: 14px; align-items: center; padding: 16px; border-radius: 16px; background: linear-gradient(135deg, #3a1522, #1a1218); border: 1px solid rgba(224,68,90,.6); box-shadow: 0 0 30px rgba(224,68,90,.2); }
  .bk-ticket .mv { font-size: 18px; font-weight: 800; line-height: 1.2; }
  .bk-ticket .mvja { font-size: 13px; color: #b9aeb0; margin-bottom: 10px; }
  .bk-ticket svg { width: 104px; height: 104px; border-radius: 8px; background: #fff; }
  .bk-ticket .code { grid-column: 1 / -1; display: flex; justify-content: space-between; align-items: baseline; padding-top: 12px; border-top: 1px dashed rgba(255,255,255,.3); font-size: 12px; color: #b9aeb0; }
  .bk-ticket .code b { font-size: 20px; letter-spacing: .12em; color: #fff; }
  @media (prefers-reduced-motion: reduce) { .booking, .booking.open { transition: none; } }
</style>
</head>
<body>

<main class="stage" id="stage" aria-label="Animated portrait with a bouncing spotlight. Shake your phone or your mouse to change the face and speed up the spotlight. Tilt your phone to steer the spotlight and move the eyes. Tap to play or pause the music, double-tap to reset it. Press and hold to see the After Hours Til Dawn Tour schedule and the 2027 encore ticket mockup.">
  <div class="ui">
    <button id="enable" class="hidden" type="button">Tap to enable shake &amp; tilt</button>
    <div id="hint" class="hint hidden"></div>
  </div>
</main>

<section class="sheet" id="sheet" role="dialog" aria-label="After Hours Til Dawn Tour schedule" aria-hidden="true">
  <button class="close" id="sheetClose" type="button" aria-label="Close tour schedule">&times;</button>
  <div class="kicker">The Weeknd</div>
  <h2>After Hours Til Dawn Tour</h2>
  <div class="sub" id="sheetSub"></div>
  <div class="tabs" id="tabs" role="tablist" aria-label="Tour year">
    <button type="button" role="tab" data-tab="encore">Encore 2027 (concept)</button>
    <button type="button" role="tab" data-tab="y2026">2026 tour</button>
  </div>
  <div class="banner" id="banner"></div>
  <div class="legs" id="legs"></div>
  <p class="note" id="sheetNote"></p>
</section>

<section class="booking" id="booking" role="dialog" aria-modal="true" aria-label="Encore tour tickets (mockup)" aria-hidden="true">
  <div class="bk-wrap">
    <header class="bk-head">
      <button class="bk-round" id="bkBack" type="button" aria-label="Back">&larr;</button>
      <div class="ttl">
        <div class="kicker">The Weeknd &middot; Encore 2027 concept</div>
        <div id="bkVenue"></div>
        <div id="bkWhen"></div>
      </div>
      <button class="bk-round" id="bkClose" type="button" aria-label="Close ticket booking">&times;</button>
    </header>
    <ol class="bk-steps" id="bkSteps"></ol>
    <div class="bk-body" id="bkBody"></div>
    <footer class="bk-foot" id="bkFoot">
      <div class="bk-sum"><b id="bkSumTotal"></b><span id="bkSumInfo"></span></div>
      <button class="bk-primary" id="bkNext" type="button"></button>
    </footer>
  </div>
</section>

<script>
/* ======================= EDIT THESE ======================= */

/*
  LAYERS: list from BACK to FRONT (the order of lines = stacking order).

  id       a short name the animation script uses
  depth    0 = barely moves, 1+ = moves the most (tilt / mouse parallax)
  spot     true = the script bounces this layer around inside the background (see SPOTLIGHT below)
  faces    true = these layers are the face frames. Only ONE shows at a time; a shake switches to the next.
  origin   pivot point as "x% y%" of the whole canvas (used for the little pop when the face changes)
*/
const FACE = { depth: 0.60, origin: "50% 60%", faces: true };

// ---- Eyes ----
// Each entry gives one face its eye artwork. Both eyes are in one PNG, so the page splits it into a left-eye
// window and a right-eye window and slides each one separately, so neither can leave its own eye.
//   face   which face it belongs to (0 = face01, 1 = face02, 2 = face03). Faces without an entry show no moving eyes.
//   split  where the PNG divides between the two eyes (fraction of image width, anywhere in the gap between them)
//   left / right   how far that eye may slide from where you drew it (your drawn position = 0), as a fraction of image width
//                  (negative = toward the left of the image, positive = toward the right). This is the "ocular space":
//                  the eye can never go past these numbers, whatever the tilt or glance asks for.
const EYE_SETS = [
  { face: 0, src: "layer4-weeknd-eye01.png", split: 0.342,
    left:  { min: -0.0071, max: 0.0171 },
    right: { min: -0.0086, max: 0.0157 } }
  // When you have eyes for the other faces, add them, for example:
  // { face: 1, src: "layer4-weeknd-eye02.png", split: 0.342, left: { min: -0.03, max: 0.003 }, right: { min: -0.04, max: 0.004 } },
];
const EYE_SWING = 0.0114;       // how far the eyes travel each way from the drawn (centred) position, as a fraction of image width.
                                // The range limits above still apply, so a bigger swing can never push an eye out of its socket.
const EYE_IDLE_HOLD = [1.4, 3.6];   // seconds the eyes hold a look before glancing the other way (min, max)
const EYE_IDLE_CENTER_CHANCE = 0.25;// chance a glance returns to the middle instead of going to the other side
const EYE_FOLLOW = 14;          // how quickly the eyes catch up to where they're looking (higher = snappier)
const EYE_TILT_GAIN = 1.5;      // how much of the range a tilt uses (1.5 = reaches the edge at about two thirds of TILT_RANGE)
const EYE_TILT_DEADZONE = 0.08; // sideways tilt below this still counts as neutral (eyes keep glancing on their own)
const EYE_TILT_BLEND = 0.15;    // how far past the deadzone before tilt fully takes over
const EYE_DIR = 1;              // set to -1 if the eyes look the opposite way to your tilt

// Builds the two eye layers (left window, right window) for one face
function eyeLayers(set) {
  const mk = (side, range, clip) => ({
    id: "eye" + set.face + side, src: set.src, depth: FACE.depth, origin: FACE.origin,
    eye: { face: set.face, clip, min: range.min, max: range.max }
  });
  return [
    mk("L", set.left,  "inset(0 " + ((1 - set.split) * 100) + "% 0 0)"),
    mk("R", set.right, "inset(0 0 0 " + (set.split * 100) + "%)")
  ];
}

const LAYERS = [
  { id: "background", src: "layer1-weeknd-background.png", depth: 0.15 },
  // Spotlight: bounces around inside the background's coloured area on its own.
  // Its depth matches the background's so it stays inside the edges while you tilt. (spot: true = script moves it)
  { id: "spot",       src: "layer2-weeknd-spotlight.png",  depth: 0.15, spot: true },

  // Face frames: shake to cycle 01 -> 02 -> 03 -> 01
  { id: "face1", src: "layer3-weeknd-face01.png", ...FACE },
  { id: "face2", src: "layer3-weeknd-face02.png", ...FACE },
  { id: "face3", src: "layer3-weeknd-face03.png", ...FACE },

  // Eyes sit on top of their face and move with it
  ...EYE_SETS.flatMap(eyeLayers)
];

// ---- Movement feel (tilt on phone, pointer position on desktop) ----
const MAX_SHIFT = 0.03;      // front-layer travel as a fraction of image width
const TILT_RANGE = 20;       // degrees of phone tilt for full movement
const SMOOTHING = 0.08;      // 0.04 = floaty, 0.15 = snappy
const DIRECTION = 1;         // set to -1 if the movement feels backwards

// ---- Spotlight ----
// Units are "image widths per second": 0.1 = crosses a tenth of the image width each second.
const SPOT_IDLE_SPEED = 0.08;   // drifting speed while idle
const SPOT_SHAKE_MULT = 4;      // how many times faster it gets at the peak of a shake
const SPOT_SHAKE_DECAY = 2.0;   // seconds for the shake speed-up to die back down
const SPOT_SPEED_EASE = 1.5;    // how quickly it speeds up / slows to its target (higher = snappier)
const SPOT_TILT_ACCEL = 1.0;    // how strongly tilt pushes it (higher = more responsive)
const SPOT_TILT_MAX = 0.9;      // top speed while tilted
const SPOT_TILT_DEADZONE = 0.10;// tilt below this (0..1 of TILT_RANGE) counts as neutral
const SPOT_TILT_DIR = 1;        // set to -1 if it travels the opposite way to your tilt

/* ---------- Spotlight: bounce around inside the coloured area ---------- */

let minX = 0, maxX = 0, minY = 0, maxY = 0;

// Downscale an image and find the box around the pixels that pass a test
function scanBox(img, test) {
  const w = 300, h = Math.max(1, Math.round(w * img.naturalHeight / img.naturalWidth));
  const c = document.createElement("canvas");
  c.width = w; c.height = h;
  const ctx = c.getContext("2d", { willReadFrequently: true });
  ctx.drawImage(img, 0, 0, w, h);
  const d = ctx.getImageData(0, 0, w, h).data;
  let x0 = w, x1 = -1, y0 = h, y1 = -1;
  for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
    const i = (y * w + x) * 4;
    if (test(d[i], d[i + 1], d[i + 2], d[i + 3])) {
      if (x < x0) x0 = x; if (x > x1) x1 = x; if (y < y0) y0 = y; if (y > y1) y1 = y;
    }
  }
  return x1 < 0 ? null : { x0: x0 / w, x1: (x1 + 1) / w, y0: y0 / h, y1: (y1 + 1) / h };
}

function setupSpot() {
  if (!spotLayer) return;
  const spotImg = spotLayer.el;
  spotRatio = bgImg.naturalHeight / bgImg.naturalWidth;
  let g = SPOT_FALLBACK;
  try {
    const b = scanBox(bgImg, (r, gg, bl, a) => a > 128 && r + gg + bl < 740);   // coloured (not white / transparent) area
    const sp = scanBox(spotImg, (r, gg, bl, a) => a > 128);                       // the spotlight circle
    if (b && sp) g = { left: b.x0, right: b.x1, top: b.y0, bottom: b.y1,
                       cx: (sp.x0 + sp.x1) / 2, cy: (sp.y0 + sp.y1) / 2, rx: (sp.x1 - sp.x0) / 2, ry: (sp.y1 - sp.y0) / 2 };
  } catch (e) {
    console.info("Couldn't read the images to measure them (normal when opened from disk). Using SPOT_FALLBACK.");
  }
  natX = g.cx; natY = g.cy * spotRatio;
  minX = g.left + g.rx;   maxX = g.right - g.rx;
  minY = (g.top + g.ry) * spotRatio; maxY = (g.bottom - g.ry) * spotRatio;
  if (minX > maxX) minX = maxX = (minX + maxX) / 2;
  if (minY > maxY) minY = maxY = (minY + maxY) / 2;
  px = clamp(natX, minX, maxX); py = clamp(natY, minY, maxY);
  const ang = (20 + Math.random() * 50) * Math.PI / 180;
  vx = Math.cos(ang) * SPOT_IDLE_SPEED * (Math.random() < 0.5 ? -1 : 1);
  vy = Math.sin(ang) * SPOT_IDLE_SPEED * (Math.random() < 0.5 ? -1 : 1);
  spotReady = true;
}

// Start once the background and the spotlight have both loaded

  [bgImg, spotLayer.el].forEach(im => {
    if (im.complete && im.naturalWidth) done(); else im.addEventListener("load", done, { once: true });
  });
}

function updateSpot(dt) {
  shakeEnergy *= Math.exp(-dt / SPOT_SHAKE_DECAY);
  const target = SPOT_IDLE_SPEED * (1 + (SPOT_SHAKE_MULT - 1) * shakeEnergy);   // faster while shaken
  const tilting = Math.hypot(cx, cy) > SPOT_TILT_DEADZONE;
  let s = Math.hypot(vx, vy);

  if (tilting) {
    // tilt pushes it the way you're tilting, like a ball rolling on the screen
    vx += cx * SPOT_TILT_ACCEL * SPOT_TILT_DIR * dt;
    vy += cy * SPOT_TILT_ACCEL * SPOT_TILT_DIR * dt;
    s = Math.hypot(vx, vy);
    if (s > SPOT_TILT_MAX) { vx *= SPOT_TILT_MAX / s; vy *= SPOT_TILT_MAX / s; }
  } else if (s < 1e-4) {
    vx = target; vy = target * 0.6;
  } else {
    // ease toward the idle (or shake-boosted) speed, keeping its direction
    const ns = s + (target - s) * (1 - Math.exp(-dt * SPOT_SPEED_EASE));
    vx *= ns / s; vy *= ns / s;
  }

  px += vx * dt; py += vy * dt;
  const keep = tilting ? SPOT_TILT_BOUNCE : 1;
  if (px < minX) { px = minX; vx = Math.abs(vx) * keep; }
  else if (px > maxX) { px = maxX; vx = -Math.abs(vx) * keep; }
  if (py < minY) { py = minY; vy = Math.abs(vy) * keep; }
  else if (py > maxY) { py = maxY; vy = -Math.abs(vy) * keep; }
}

  gaze += (goal - gaze) * (1 - Math.exp(-dt * EYE_FOLLOW));
}

setInterval(() => {

  const z = ZONE_BY_ID[bk.zone];
  if (!z) {
    panel.appendChild(bkEl("div", "ps", bk.zoneMsg || "No section chosen yet. / まだエリアが選ばれていません。"));
    return;
  }
  const info = bk.zones[z.id];
  panel.appendChild(bkEl("div", "pt", z.label + (z.ga ? "" : " \u00B7 " + TIER_NAMES[z.tier])));
  if (z.ga) panel.appendChild(bkEl("div", "ps", TIER_NAMES[z.tier] + ". No assigned seats, first come first served. / 立ち見・指定席なし"));
  const pp = bkEl("div", "pp", bkMoney(bkLocal(z.usd)) + " each \u00B7 " + bk.qty + " \u00D7 = " + bkMoney(bkSubtotal()));
  if (info.status === "low") pp.appendChild(bkEl("span", "low", z.ga ? "  \u00B7 Few left" : "  \u00B7 Selling fast"));
  panel.appendChild(pp);
  if (z.ga) return;

  const best = bkEl("button", "bk-ghost", "Best available / おまかせ"); best.type = "button"; best.style.marginTop = "12px";
  best.addEventListener("click", () => { bk.seats = bkBestSeats(z, bk.qty, info.sold); bkPaintSeats(); bkFooter(); });
  panel.appendChild(best);
  panel.appendChild(bkEl("div", "rowhint", "FRONT \u2191 \u00B7 ROW A"));
  const grid = bkEl("div", "seatgrid");
  grid.style.gridTemplateColumns = "repeat(" + z.cols + ", minmax(0, 1fr))";
  bk.seatEls = {};
  for (let ri = 0; ri < z.rows; ri++) for (let c = 1; c <= z.cols; c++) {
    const id = bkRowName(ri) + c;
    const b = bkEl("button", "seat"); b.type = "button";
    if (info.sold.has(id)) { b.disabled = true; b.setAttribute("aria-label", "Row " + bkRowName(ri) + ", seat " + c + ", taken"); }
    else {
      b.setAttribute("aria-label", "Row " + bkRowName(ri) + ", seat " + c + ", available");
      b.setAttribute("aria-pressed", "false");
      b.addEventListener("click", () => bkToggleSeat(id));
    }
    bk.seatEls[id] = b;
    grid.appendChild(b);
  }
  panel.appendChild(grid);
  const picked = bkEl("div", "bk-picked"); picked.id = "bkPicked";
  panel.appendChild(picked);
  bkPaintSeats();
}
function bkToggleSeat(id) {
  const i = bk.seats.indexOf(id);
  if (i >= 0) bk.seats.splice(i, 1);
  else { if (bk.seats.length >= bk.qty) bk.seats.shift(); bk.seats.push(id); }   // one too many drops the oldest pick
  bkPaintSeats();
  bkFooter();
}
function bkPaintSeats() {
  Object.keys(bk.seatEls).forEach(id => { const el = bk.seatEls[id]; if (!el.disabled) el.setAttribute("aria-pressed", bk.seats.includes(id) ? "true" : "false"); });
  const p = document.getElementById("bkPicked");
  if (p) p.textContent = bk.seats.length ? "Your seats: " + bk.seats.slice().sort(bkSeatSort).join(", ") : "Choose " + bk.qty + (bk.qty === 1 ? " seat" : " seats");
}
// A group together near the middle of the section, a few rows back
function bkBestSeats(z, n, sold) {
  const mid = Math.floor(z.rows * 0.4), centre = (z.cols + 1) / 2;
  const order = [...Array(z.rows).keys()].sort((a, b) => Math.abs(a - mid) - Math.abs(b - mid));
  for (const ri of order) {
    const starts = [];
    for (let s = 1; s + n - 1 <= z.cols; s++) starts.push(s);
    starts.sort((a, b) => Math.abs(a + (n - 1) / 2 - centre) - Math.abs(b + (n - 1) / 2 - centre));
    for (const s of starts) {
      const ids = [];
      for (let k = 0; k < n; k++) ids.push(bkRowName(ri) + (s + k));
      if (ids.every(id => !sold.has(id))) return ids;
    }
  }
  const free = [];                                       // no group fits: any free seats
  for (let ri = 0; ri < z.rows; ri++) for (let c = 1; c <= z.cols; c++) if (!sold.has(bkRowName(ri) + c)) free.push(bkRowName(ri) + c);
  return free.slice(0, n);
}

/* --- step 3: extras, review, pay (pretend) --- */
function bkKv(label, value, cls) {
  const r = bkEl("div", "bk-kv" + (cls ? " " + cls : ""));
  r.append(bkEl("span", null, label), bkEl("span", null, value));
  return r;
}
function bkSeatText() {
  const z = ZONE_BY_ID[bk.zone];
  return z.ga ? z.label + " \u00B7 standing" : z.label + " \u00B7 " + bk.seats.slice().sort(bkSeatSort).join(", ");
}
function bkFillSummary(box) {
  box.textContent = "";
  const z = ZONE_BY_ID[bk.zone];
  box.appendChild(bkEl("h4", null, "Order summary"));
  box.append(
    bkKv("Venue", bk.stop.venue),
    bkKv("City", bk.stop.city),
    bkKv("Date", fmtLong(bk.night)),
    bkKv("Doors / show", DOORS_TIME + " / " + SHOW_TIME),
    bkKv("Where", bkSeatText()),
    bkKv(bk.qty + " \u00D7 " + (z.ga ? "Standing" : "Reserved seat"), bkMoney(bkSubtotal())),
    bkKv("Service fee", bkMoney(bkFee()))
  );
  EXTRAS.forEach(x => {
    if (bk.extras[x.id]) box.appendChild(bkKv(x.en + (x.per === "ticket" ? " \u00D7 " + bk.qty : ""), bkMoney(bkLocal(x.usd) * (x.per === "ticket" ? bk.qty : 1))));
  });
  box.appendChild(bkKv("Total", bkMoney(bkGrand()), "total"));
}
function bkStepReview(body) {
  body.appendChild(bkEl("div", "bk-hold"));
  body.appendChild(bkEl("h3", "bk-h", "Review your order"));
  const sum = bkEl("div", "bk-card");
  bkFillSummary(sum);
  body.appendChild(sum);

  const ex = bkEl("div", "bk-card");
  ex.appendChild(bkEl("h4", null, "Extras (optional)"));
  EXTRAS.forEach(x => {
    const b = bkEl("button", "bk-opt"); b.type = "button"; b.setAttribute("role", "switch");
    const main = bkEl("span", "main", x.en); main.appendChild(bkEl("small", null, x.ja + (x.per === "ticket" ? " \u00B7 per ticket" : "")));
    b.append(bkEl("span", "box"), main, bkEl("span", "amt", "+" + bkMoney(bkLocal(x.usd))));
    b.setAttribute("aria-checked", bk.extras[x.id] ? "true" : "false");
    b.addEventListener("click", () => {
      bk.extras[x.id] = !bk.extras[x.id];
      b.setAttribute("aria-checked", bk.extras[x.id] ? "true" : "false");
      bkFillSummary(sum);
      bkFooter();
    });
    ex.appendChild(b);
  });
  body.appendChild(ex);

  const pay = bkEl("div", "bk-card");
  pay.appendChild(bkEl("h4", null, "Payment method"));
  const radios = [];
  PAYMENT_METHODS.forEach(m => {
    const b = bkEl("button", "bk-opt"); b.type = "button"; b.setAttribute("role", "radio");
    const main = bkEl("span", "main", m.en); main.appendChild(bkEl("small", null, m.ja));
    b.append(bkEl("span", "dot"), main);
    b.setAttribute("aria-checked", m.id === bk.pay ? "true" : "false");
    b.addEventListener("click", () => { bk.pay = m.id; radios.forEach(([id, el]) => el.setAttribute("aria-checked", id === bk.pay ? "true" : "false")); });
    radios.push([m.id, b]);
    pay.appendChild(b);
  });
  body.appendChild(pay);
  body.appendChild(bkEl("div", "bk-demo", "Demo only: nothing is charged and no payment details are collected. / デモです。実際の請求や決済情報の入力はありません。"));
}
function bkPay() {
  if (bk.paying) return;
  const mine = bk;
  bk.paying = true;
  bkFooter();
  setTimeout(() => {
    if (bk !== mine) return;                             // closed while "processing": nothing was booked
    const z = ZONE_BY_ID[mine.zone];
    const digits = String(Math.floor(bkRand(mine.key + Date.now())() * 1e6)).padStart(6, "0");
    mine.code = "AHTD-" + digits;
    if (!z.ga) (bkBought[mine.key + "|" + z.id] = bkBought[mine.key + "|" + z.id] || []).push(...mine.seats);
    mine.holdEnd = null;
    mine.paying = false;
    bkGo(4);
  }, 1400);
}

/* --- step 4: your (pretend) ticket --- */
function bkQR(code) {
  const rnd = bkRand(code), N = 21;
  const svg = bkSvg("svg", { viewBox: "0 0 " + N + " " + N, role: "img", "aria-label": "Sample QR code (not scannable)" });
  const rect = (x, y, w, h, fill) => svg.appendChild(bkSvg("rect", { x, y, width: w, height: h, fill }));
  rect(0, 0, N, N, "#fff");
  const finder = (ox, oy) => { rect(ox, oy, 7, 7, "#000"); rect(ox + 1, oy + 1, 5, 5, "#fff"); rect(ox + 2, oy + 2, 3, 3, "#000"); };
  finder(0, 0); finder(N - 7, 0); finder(0, N - 7);
  for (let y = 0; y < N; y++) for (let x = 0; x < N; x++) {
    if ((x < 8 && y < 8) || (x >= N - 8 && y < 8) || (x < 8 && y >= N - 8)) continue;
    if (rnd() < 0.5) rect(x, y, 1, 1, "#000");
  }
  return svg;
}
function bkStepDone(body) {
  body.append(bkEl("div", "bk-ok", "\u2713 Booked (demo)"), bkEl("div", "bk-okja", "購入完了(デモ)"));
  const t = bkEl("div", "bk-ticket");
  const info = bkEl("div");
  info.append(bkEl("div", "mv", ENCORE_NAME), bkEl("div", "mvja", "The Weeknd \u00B7 fan concept"));
  info.append(
    bkKv("Venue", bk.stop.venue),
    bkKv("City", bk.stop.city),
    bkKv("Date", fmtLong(bk.night)),
    bkKv("Doors / show", DOORS_TIME + " / " + SHOW_TIME),
    bkKv("Where", bkSeatText()),
    bkKv(bk.qty + (bk.qty === 1 ? " ticket" : " tickets"), bkMoney(bkGrand()))
  );
  const codeRow = bkEl("div", "code");
  codeRow.append(bkEl("span", null, "Booking code"), bkEl("b", null, bk.code));
  t.append(info, bkQR(bk.code), codeRow);
  body.append(t, bkEl("p", "note", "This is a demo ticket for an imaginary tour. No payment was made and nothing was booked. / 架空のツアーのデモ用チケットです。実際の購入・予約は行われていません。"));
}

/* ---------- Tour schedule sheet (opened by a long press) ---------- */

const sheet = document.getElementById("sheet");
let sheetOpen = false, sheetTimer = null;

function todayISO() {
  const parts = new Intl.DateTimeFormat("en-CA", { timeZone: TOUR_TIMEZONE, year: "numeric", month: "2-digit", day: "2-digit" }).formatToParts(new Date());
  const get = type => (parts.find(p => p.type === type) || {}).value;
  return get("year") + "-" + get("month") + "-" + get("day");
}

let sheetTab = "encore";                 // "encore" (2027 concept) or "y2026" (the real 2026 tour)

// ---- dates ----
const bkIso = iso => new Date(iso + "T00:00:00Z");
function shiftISO(iso, days) { const d = bkIso(iso); d.setUTCDate(d.getUTCDate() + days); return d.toISOString().slice(0, 10); }
function stopNights(st) { return st.encore || st.nights.map(n => shiftISO(n, ENCORE_SHIFT_DAYS)); }
// ["2027-07-07","2027-07-09","2027-07-10"] -> "Jul 7, 9\u201310"
function fmtNights(list) {
  const mon = new Intl.DateTimeFormat("en-US", { month: "short", timeZone: "UTC" });
  const runs = [];
  list.forEach((iso, i) => {
    if (i && (bkIso(iso) - bkIso(list[i - 1])) / 86400000 === 1) runs[runs.length - 1].push(iso);
    else runs.push([iso]);
  });
  let lastMon = "";
  return runs.map(r => {
    const a = bkIso(r[0]), b = bkIso(r[r.length - 1]);
    const ma = mon.format(a), mb = mon.format(b);
    let t = (ma === lastMon ? "" : ma + " ") + a.getUTCDate();
    if (r.length > 1) t += "\u2013" + (mb === ma ? "" : mb + " ") + b.getUTCDate();
    lastMon = mb;
    return t;
  }).join(", ");
}
const fmtLong = iso => new Intl.DateTimeFormat("en-US", { timeZone: "UTC", weekday: "short", month: "short", day: "numeric", year: "numeric" }).format(bkIso(iso));

function renderSheet() {
  const today = todayISO();
  const encore = sheetTab === "encore";
  document.getElementById("sheetSub").textContent = encore ? "2027 encore \u00B7 fan concept" : "2026 stadium dates";
  document.querySelectorAll("#tabs button").forEach(b => b.setAttribute("aria-selected", b.dataset.tab === sheetTab ? "true" : "false"));
  const legsBox = document.getElementById("legs");
  legsBox.textContent = "";
  let nextMarked = false, upcoming = 0, total = 0, shows = 0;
  TOUR_LEGS.forEach(leg => {
    const h = document.createElement("h3");
    h.textContent = leg.name;
    legsBox.appendChild(h);
    leg.stops.forEach(st => {
      const nights = encore ? stopNights(st) : st.nights;
      const done = nights[nights.length - 1] < today;
      total++; shows += nights.length;
      if (!done) upcoming++;
      const canBuy = encore && !done;
      const row = document.createElement(canBuy ? "button" : "div");
      row.className = "stop" + (done ? " done" : "");
      if (canBuy) {
        row.type = "button";
        row.setAttribute("aria-label", st.city + ", " + st.venue + ", " + fmtNights(nights) + ". Tickets.");
        row.addEventListener("click", () => openBooking(st));
      }
      if (!done && !nextMarked) { row.classList.add("next"); nextMarked = true; }
      const d = document.createElement("div"); d.className = "d"; d.textContent = fmtNights(nights);
      const c = document.createElement("div"); c.className = "c"; c.textContent = st.city;
      const v = document.createElement("div"); v.className = "v"; v.textContent = st.venue;
      row.append(d, c, v);
      if (canBuy) { const go = document.createElement("div"); go.className = "go"; go.textContent = "Tickets \u203A"; row.appendChild(go); }
      legsBox.appendChild(row);
    });
  });
  const banner = document.getElementById("banner");
  banner.textContent = "";
  if (encore) {
    const b = document.createElement("b"); b.textContent = "Fan concept, not a real announcement. ";
    banner.append(b, total + " stops and " + shows + " shows at the same stadiums as 2026, with the dates moved forward 52 weeks. Tap a stop to try the ticket mockup.");
  } else if (upcoming === 0) {
    const b = document.createElement("b"); b.textContent = "The tour has wrapped. ";
    banner.append(b, "The last show was " + TOUR_FINALE + ". No further dates are announced.");
  } else {
    const b = document.createElement("b"); b.textContent = upcoming + " of " + total + " stops still to come. ";
    banner.append(b, "Past stops are greyed out.");
  }
  document.getElementById("sheetNote").textContent = encore
    ? "Imagined tour for a concept piece: the dates, prices and seating plans are invented, and no tickets are sold. / ファンによるコンセプトです。日程・料金・座席は架空のもので、チケットの販売はありません。"
    : "Dates are as listed on the tour's Wikipedia page and may change. Check theweeknd.com/tour for the official word.";
}
document.getElementById("tabs").addEventListener("click", e => {
  const b = e.target.closest("button[data-tab]");
  if (!b || b.dataset.tab === sheetTab) return;
  sheetTab = b.dataset.tab;
  renderSheet();
  sheet.scrollTop = 0;
});

function openSheet() {
  renderSheet();
  sheet.scrollTop = 0;
  sheet.classList.add("open");
  sheet.setAttribute("aria-hidden", "false");
  sheetOpen = true;
  clearTimeout(sheetTimer);
  if (SHEET_AUTOHIDE > 0) sheetTimer = setTimeout(closeSheet, SHEET_AUTOHIDE * 1000);
}
function closeSheet() {
  sheet.classList.remove("open");
  sheet.setAttribute("aria-hidden", "true");
  sheetOpen = false;
  clearTimeout(sheetTimer);
}
document.getElementById("sheetClose").addEventListener("click", closeSheet);
window.addEventListener("keydown", e => { if (e.key === "Escape") { if (bookingOpen) bkBack(); else closeSheet(); } });

// A tap = press and release without moving much. It is detected on release because phones only allow
// audio to start from a release (not a press).
// A long press (held LONG_PRESS_TIME without moving) opens the tour schedule instead and is never also a tap.
let down = null;
let lastTap = -99;
let holdTimer = null;
function cancelHold() { clearTimeout(holdTimer); holdTimer = null; }

stage.addEventListener("pointerdown", e => {
  if (e.target.closest && e.target.closest(".ui button")) { down = null; return; }
  down = { x: e.clientX, y: e.clientY, id: e.pointerId, long: false };
  cancelHold();
  if (sheetOpen) return;
  const mine = down;
  holdTimer = setTimeout(() => {
    holdTimer = null;
    if (down !== mine) return;
    mine.long = true;
    if (navigator.vibrate) navigator.vibrate(20);
    openSheet();
  }, LONG_PRESS_TIME * 1000);
});
stage.addEventListener("pointermove", e => {
  if (down && !down.long && down.id === e.pointerId && Math.hypot(e.clientX - down.x, e.clientY - down.y) > TAP_MAX_MOVE) cancelHold();
});
stage.addEventListener("pointercancel", () => { cancelHold(); down = null; });
stage.addEventListener("contextmenu", e => e.preventDefault());
stage.addEventListener("pointerup", e => {
  if (!down || down.id !== e.pointerId) return;
  cancelHold();
  const held = down;
  const moved = Math.hypot(e.clientX - held.x, e.clientY - held.y);
  down = null;
  if (held.long) return;                                // it was a long press, not a tap
  if (moved > TAP_MAX_MOVE) return;
  if (sheetOpen) { closeSheet(); return; }              // a tap while the schedule is open just closes it

  const now = performance.now() / 1000;
  if (now - lastTap < DOUBLE_TAP_TIME) {
    // double-tap: reset the music (the first tap of the pair already toggled it, this undoes that)
    lastTap = -99;
    resetAudio();
    if (DOUBLE_TAP_RECENTERS) base = null;
    return;
  }
  lastTap = now;
  togglePlay();
  if (TAP_CYCLES) nextFace();
});

// iOS needs a tap to grant motion access (one prompt covers both tilt and shake)
const needsPermission =
  (typeof DeviceMotionEvent !== "undefined" && typeof DeviceMotionEvent.requestPermission === "function") ||
  (typeof DeviceOrientationEvent !== "undefined" && typeof DeviceOrientationEvent.requestPermission === "function");

const isTouch = matchMedia("(pointer: coarse)").matches;

if (needsPermission) {
  enableBtn.classList.remove("hidden");
  enableBtn.addEventListener("click", async () => {
    try {
      const req = typeof DeviceMotionEvent.requestPermission === "function"
        ? DeviceMotionEvent.requestPermission()
        : DeviceOrientationEvent.requestPermission();
      const result = await req;
      if (result === "granted") {
        startSensors();
      } else {
        enableBtn.classList.add("hidden");
        showHint("Motion access was denied. Reload the page to try again.", 5000);
      }
    } catch (err) {
      showHint("Couldn't enable motion on this page.", 4000);
    }
  });
} else if (isTouch && ("DeviceMotionEvent" in window || "DeviceOrientationEvent" in window)) {
  startSensors();
} else {
  showHint("Wiggle your mouse to change the face and speed up the light. Click for music, double-click to reset. Hold for tour dates.", 5000);
}
</script>
