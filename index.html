<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Shake – Weeknd</title>
<style>
  :root { color-scheme: dark; }
  html, body { height: 100%; margin: 0; background: #151515; overflow: hidden; }
  body { display: grid; place-items: center; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }

  .stage {
    --ar: 1;
    position: relative;
    width: min(100vw, calc(100dvh * var(--ar)));
    aspect-ratio: var(--ar);
    overflow: hidden;
    touch-action: none;
    -webkit-tap-highlight-color: transparent;
    -webkit-touch-callout: none;
    user-select: none;
  }
  .layer {
    position: absolute;
    left: 0; top: 0; width: 100%; height: 100%;
    object-fit: fill;
    will-change: transform;
    pointer-events: none;
    user-select: none;
    -webkit-user-drag: none;
  }

  /* eye layers: a static clipped window (keeps each eye apart) with the eye artwork sliding inside it */
  .eyewrap { overflow: visible; }
  .eyewrap > img {
    position: absolute; left: 0; top: 0; width: 100%; height: 100%;
    will-change: transform; pointer-events: none; user-select: none; -webkit-user-drag: none;
  }

  .ui {
    position: absolute; left: 0; right: 0; bottom: max(16px, env(safe-area-inset-bottom));
    display: flex; flex-direction: column; align-items: center; gap: 8px;
    pointer-events: none;
  }
  button#enable {
    pointer-events: auto;
    font-weight: 600; font-size: 15px; line-height: 1; font-family: inherit;
    padding: 12px 20px; border-radius: 999px; border: 0;
    background: #f2f2f2; color: #151515; cursor: pointer;
  }
  button#enable:focus-visible { outline: 3px solid #7fb4ff; outline-offset: 3px; }
  .hint {
    font-size: 13px; color: #fff; background: rgba(0,0,0,.55);
    padding: 6px 12px; border-radius: 999px;
    transition: opacity .6s ease;
  }
  .hidden { display: none !important; }
  .fade { opacity: 0; }

  /* ---- Tour sheet (long press) ---- */
  .sheet {
    position: fixed; left: 50%; bottom: 0; z-index: 20;
    width: min(100vw, 520px); max-height: 80dvh; overflow: auto; overscroll-behavior: contain;
    box-sizing: border-box; padding: 22px 20px max(22px, env(safe-area-inset-bottom));
    background: rgba(18, 18, 20, .93);
    -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px);
    border-top: 2px solid #e0445a; border-radius: 20px 20px 0 0;
    color: #f1eded;
    transform: translate(-50%, 105%);
    transition: transform .45s cubic-bezier(.2,.8,.2,1);
    box-shadow: 0 -10px 40px rgba(224, 68, 90, .18);
  }
  .sheet.open { transform: translate(-50%, 0); }
  .sheet .close {
    position: absolute; top: 10px; right: 12px; width: 36px; height: 36px;
    border: 0; border-radius: 50%; background: rgba(255,255,255,.1); color: #fff;
    font-size: 20px; line-height: 1; cursor: pointer;
  }
  .sheet .close:focus-visible { outline: 3px solid #7fb4ff; outline-offset: 2px; }
  .kicker { font-size: 12px; letter-spacing: .2em; color: #e0445a; text-transform: uppercase; }
  .sheet h2 { margin: 6px 40px 0 0; font-size: 22px; font-weight: 700; line-height: 1.2; }
  .sub { font-size: 14px; color: #b9aeb0; margin-top: 2px; }
  .banner { margin-top: 14px; padding: 10px 12px; border-radius: 12px; font-size: 14px; line-height: 1.4;
    background: rgba(224, 68, 90, .12); border: 1px solid rgba(224, 68, 90, .4); }
  .banner b { color: #ff8da0; }
  .legs { margin-top: 8px; }
  .legs h3 { margin: 18px 0 6px; font-size: 12px; letter-spacing: .16em; text-transform: uppercase; color: #ff8da0; font-weight: 600; }
  .stop { display: grid; grid-template-columns: 112px 1fr; gap: 4px 12px; padding: 10px 0; border-top: 1px solid rgba(255,255,255,.09); }
  .stop .d { font-size: 15px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .stop .c { font-size: 15px; font-weight: 600; }
  .stop .v { grid-column: 2; font-size: 12px; color: #b9aeb0; margin-top: -2px; }
  .stop.done { opacity: .45; }
  .stop.next { opacity: 1; border-left: 3px solid #ff9a2e; padding-left: 9px; margin-left: -12px; background: rgba(255,154,46,.1); }
  .stop.next .d::after { content: " \00B7  next"; color: #ffb35c; font-weight: 600; font-size: 12px; }
  .note { margin: 16px 0 0; font-size: 11px; line-height: 1.5; color: #8d8386; }
</style>
</head>
<body>

<main class="stage" id="stage" aria-label="Animated portrait with a bouncing spotlight. Shake your phone or your mouse to change the face and speed up the spotlight. Tilt your phone to steer the spotlight and move the eyes. Tap to play or pause the music, double-tap to reset it. Press and hold to see the After Hours Til Dawn Tour schedule.">
  <div class="ui">
    <button id="enable" class="hidden" type="button">Tap to enable shake &amp; tilt</button>
    <div id="hint" class="hint hidden"></div>
  </div>
</main>

<section class="sheet" id="sheet" role="dialog" aria-label="After Hours Til Dawn Tour schedule" aria-hidden="true">
  <button class="close" id="sheetClose" type="button" aria-label="Close tour schedule">&times;</button>
  <div class="kicker">The Weeknd</div>
  <h2>After Hours Til Dawn Tour</h2>
  <div class="sub">2026 stadium dates</div>
  <div class="banner" id="banner"></div>
  <div class="legs" id="legs"></div>
  <p class="note" id="sheetNote"></p>
</section>

<script>
/* ======================= EDIT THESE ======================= */

/*
  LAYERS: list from BACK to FRONT (the order of lines = stacking order).

  id       a short name the animation script uses
  depth    0 = barely moves, 1+ = moves the most (tilt / mouse parallax)
  spot     true = the script bounces this layer around inside the background (see SPOTLIGHT below)
  faces    true = these layers are the face frames. Only ONE shows at a time; a shake switches to the next.
  origin   pivot point as "x% y%" of the whole canvas (used for the little pop when the face changes)
*/
const FACE = { depth: 0.60, origin: "50% 60%", faces: true };

// ---- Eyes ----
// Each entry gives one face its eye artwork. Both eyes are in one PNG, so the page splits it into a left-eye
// window and a right-eye window and slides each one separately, so neither can leave its own eye.
//   face   which face it belongs to (0 = face01, 1 = face02, 2 = face03). Faces without an entry show no moving eyes.
//   split  where the PNG divides between the two eyes (fraction of image width, anywhere in the gap between them)
//   left / right   how far that eye may slide from where you drew it (your drawn position = 0), as a fraction of image width
//                  (negative = toward the left of the image, positive = toward the right). This is the "ocular space":
//                  the eye can never go past these numbers, whatever the tilt or glance asks for.
const EYE_SETS = [
  { face: 0, src: "layer4-weeknd-eye01.png", split: 0.342,
    left:  { min: -0.0071, max: 0.0171 },
    right: { min: -0.0086, max: 0.0157 } }
  // When you have eyes for the other faces, add them, for example:
  // { face: 1, src: "layer4-weeknd-eye02.png", split: 0.342, left: { min: -0.03, max: 0.003 }, right: { min: -0.04, max: 0.004 } },
];
const EYE_SWING = 0.0114;       // how far the eyes travel each way from the drawn (centred) position, as a fraction of image width.
                                // The range limits above still apply, so a bigger swing can never push an eye out of its socket.
const EYE_IDLE_HOLD = [1.4, 3.6];   // seconds the eyes hold a look before glancing the other way (min, max)
const EYE_IDLE_CENTER_CHANCE = 0.25;// chance a glance returns to the middle instead of going to the other side
const EYE_FOLLOW = 14;          // how quickly the eyes catch up to where they're looking (higher = snappier)
const EYE_TILT_GAIN = 1.5;      // how much of the range a tilt uses (1.5 = reaches the edge at about two thirds of TILT_RANGE)
const EYE_TILT_DEADZONE = 0.08; // sideways tilt below this still counts as neutral (eyes keep glancing on their own)
const EYE_TILT_BLEND = 0.15;    // how far past the deadzone before tilt fully takes over
const EYE_DIR = 1;              // set to -1 if the eyes look the opposite way to your tilt

// Builds the two eye layers (left window, right window) for one face
function eyeLayers(set) {
  const mk = (side, range, clip) => ({
    id: "eye" + set.face + side, src: set.src, depth: FACE.depth, origin: FACE.origin,
    eye: { face: set.face, clip, min: range.min, max: range.max }
  });
  return [
    mk("L", set.left,  "inset(0 " + ((1 - set.split) * 100) + "% 0 0)"),
    mk("R", set.right, "inset(0 0 0 " + (set.split * 100) + "%)")
  ];
}

const LAYERS = [
  { id: "background", src: "layer1-weeknd-background.png", depth: 0.15 },
  // Spotlight: bounces around inside the background's coloured area on its own.
  // Its depth matches the background's so it stays inside the edges while you tilt. (spot: true = script moves it)
  { id: "spot",       src: "layer2-weeknd-spotlight.png",  depth: 0.15, spot: true },

  // Face frames: shake to cycle 01 -> 02 -> 03 -> 01
  { id: "face1", src: "layer3-weeknd-face01.png", ...FACE },
  { id: "face2", src: "layer3-weeknd-face02.png", ...FACE },
  { id: "face3", src: "layer3-weeknd-face03.png", ...FACE },

  // Eyes sit on top of their face and move with it
  ...EYE_SETS.flatMap(eyeLayers)
];

// ---- Movement feel (tilt on phone, pointer position on desktop) ----
const MAX_SHIFT = 0.03;      // front-layer travel as a fraction of image width
const TILT_RANGE = 20;       // degrees of phone tilt for full movement
const SMOOTHING = 0.08;      // 0.04 = floaty, 0.15 = snappy
const DIRECTION = 1;         // set to -1 if the movement feels backwards

// ---- Spotlight ----
// Units are "image widths per second": 0.1 = crosses a tenth of the image width each second.
const SPOT_IDLE_SPEED = 0.08;   // drifting speed while idle
const SPOT_SHAKE_MULT = 4;      // how many times faster it gets at the peak of a shake
const SPOT_SHAKE_DECAY = 2.0;   // seconds for the shake speed-up to die back down
const SPOT_SPEED_EASE = 1.5;    // how quickly it speeds up / slows to its target (higher = snappier)
const SPOT_TILT_ACCEL = 1.0;    // how strongly tilt pushes it (higher = more responsive)
const SPOT_TILT_MAX = 0.9;      // top speed while tilted
const SPOT_TILT_DEADZONE = 0.10;// tilt below this (0..1 of TILT_RANGE) counts as neutral
const SPOT_TILT_DIR = 1;        // set to -1 if it travels the opposite way to your tilt
const SPOT_TILT_BOUNCE = 0.45;  // how much speed is kept when it hits a wall while tilted (1 = full bounce)
// Fallback if the page can't read the images (e.g. opened straight from disk). Normally these are detected automatically.
// All values are fractions of the image width (x) or height (y). left/right/top/bottom = the coloured area; cx/cy/rx/ry = the spotlight circle.
const SPOT_FALLBACK = { left: 0.0445, right: 0.9558, top: 0.023, bottom: 0.8296, cx: 0.2667, cy: 0.6055, rx: 0.2069, ry: 0.1464 };

// ---- Shake: phone ----
const SHAKE_THRESHOLD = 22;  // how hard each jolt must be (lower = easier to trigger, higher = needs a harder shake)
const SHAKE_SPIKES = 3;      // how many jolts within SHAKE_WINDOW count as a shake (stops accidental bumps)
const SHAKE_WINDOW = 0.6;    // seconds

// ---- Shake: mouse (wiggle the pointer quickly back and forth) ----
const MOUSE_MIN_STROKE = 40; // pixels the pointer must travel in one direction to count as a stroke
const MOUSE_STROKES = 4;     // how many back-and-forth strokes within MOUSE_WINDOW count as a shake
const MOUSE_WINDOW = 0.8;    // seconds

// ---- Music: tap to play, tap again to pause, double-tap to reset ----
// One song per face: shaking to a new face switches to that face's song. Keep the MP3s in the same folder as this page.
//   start   seconds into the song where it begins (e.g. 45 = start at 0:45)
//   length  seconds to play from there (0 = play the whole song)
//   fade    seconds of fade-out at the end of a clip (ignored when length is 0)
// The file names must match exactly, including capitals, spaces and apostrophes.
const TRACKS = [
  { src: "The Weeknd - Moth To A Flame.mp3",              start: 0, length: 30, fade: 1.5 },   // face01
  { src: "The Weeknd - Can\u2019t Feel My Face.mp3",        start: 0, length: 30, fade: 1.5 },   // face02
  { src: "The Weeknd - Until We're Skin & Bones.mp3",     start: 0, length: 0 }                  // face03: plays in full
];
const AUDIO_LOOP = false;           // true = a song starts over by itself when it ends
const AUDIO_VOLUME = 1;             // 0 to 1
const DOUBLE_TAP_RESTARTS = false;  // false = double-tap rewinds and stays paused; true = rewinds and plays again
const DOUBLE_TAP_RECENTERS = true;  // double-tap also re-centers the tilt (the old behaviour)
const TAP_MAX_MOVE = 14;            // pixels a finger/mouse may move and still count as a tap
const DOUBLE_TAP_TIME = 0.35;       // seconds between two taps to count as a double-tap

// ---- Long press -> tour schedule ----
const LONG_PRESS_TIME = 0.5;        // seconds you must hold before the schedule opens
const SHEET_AUTOHIDE = 0;           // seconds until the schedule closes by itself (0 = stays until closed)

// The 2026 leg of the After Hours Til Dawn Tour (compiled from Wikipedia's tour page, which lists the tour ending Nov 5, 2026).
// date = how the dates are shown; last = the final night of that stop (YYYY-MM-DD), used to grey out stops that have passed.
const TOUR_LEGS = [
  { name: "Latin America", stops: [
    { date: "Apr 20\u201322", last: "2026-04-22", city: "Mexico City, Mexico",     venue: "Estadio GNP Seguros" },
    { date: "Apr 26",         last: "2026-04-26", city: "Rio de Janeiro, Brazil",  venue: "Est\u00E1dio Nilton Santos" },
    { date: "Apr 30, May 1",  last: "2026-05-01", city: "S\u00E3o Paulo, Brazil",      venue: "Est\u00E1dio MorumBIS" } ] },
  { name: "Europe & UK", stops: [
    { date: "Jun 11\u201312",  last: "2026-06-12", city: "Manchester, England",   venue: "Etihad Stadium" },
    { date: "Jun 19\u201320",  last: "2026-06-20", city: "Copenhagen, Denmark",   venue: "Parken Stadium" },
    { date: "Jun 25\u201327",  last: "2026-06-27", city: "Munich, Germany",       venue: "Allianz Arena" },
    { date: "Jul 3\u20134",    last: "2026-07-04", city: "Lille, France",         venue: "Stade Pierre-Mauroy" },
    { date: "Jul 8, 10\u201312", last: "2026-07-12", city: "Saint-Denis (Paris), France", venue: "Stade de France" },
    { date: "Jul 16\u201318",  last: "2026-07-18", city: "Amsterdam, Netherlands", venue: "Johan Cruyff Arena" },
    { date: "Jul 21\u201322",  last: "2026-07-22", city: "Nice, France",          venue: "Allianz Riviera" },
    { date: "Jul 24\u201326",  last: "2026-07-26", city: "Milan, Italy",          venue: "San Siro" },
    { date: "Jul 30\u2013Aug 1", last: "2026-08-01", city: "Frankfurt, Germany",  venue: "Deutsche Bank Park" },
    { date: "Aug 4\u20135",    last: "2026-08-05", city: "Warsaw, Poland",        venue: "PGE Narodowy" },
    { date: "Aug 8\u201310",   last: "2026-08-10", city: "Stockholm, Sweden",     venue: "Strawberry Arena" },
    { date: "Aug 14\u201316, 18\u201319", last: "2026-08-19", city: "London, England", venue: "Wembley Stadium" },
    { date: "Aug 22\u201323",  last: "2026-08-23", city: "Dublin, Ireland",       venue: "Croke Park" },
    { date: "Aug 28\u201330",  last: "2026-08-30", city: "Madrid, Spain",         venue: "Riyadh Air Metropolitano" },
    { date: "Sep 1",          last: "2026-09-01", city: "Barcelona, Spain",        venue: "Estadi Ol\u00EDmpic Llu\u00EDs Companys" },
    { date: "Sep 5\u20136",    last: "2026-09-06", city: "Lisbon, Portugal",      venue: "Est\u00E1dio do Restelo" } ] },
  { name: "Live in Asia", stops: [
    { date: "Sep 19\u201320",  last: "2026-09-20", city: "Tokyo (Tokorozawa), Japan", venue: "Belluna Dome" },
    { date: "Sep 26\u201327",  last: "2026-09-27", city: "Jakarta, Indonesia",    venue: "Jakarta International Stadium" },
    { date: "Oct 2\u20133",    last: "2026-10-03", city: "Singapore",             venue: "National Stadium" },
    { date: "Oct 7\u20138",    last: "2026-10-08", city: "Goyang (Seoul), South Korea", venue: "Goyang Stadium" },
    { date: "Oct 11\u201313",  last: "2026-10-13", city: "Bangkok, Thailand",     venue: "Rajamangala Stadium" },
    { date: "Oct 24\u201325, 30\u201331", last: "2026-10-31", city: "Hong Kong", venue: "Kai Tak Stadium" },
    { date: "Nov 4\u20135",    last: "2026-11-05", city: "Kuala Lumpur, Malaysia", venue: "TM Stadium Nasional" } ] }
];
const TOUR_FINALE = "Kuala Lumpur \u00B7 Nov 5, 2026";   // shown in the banner once every stop has passed
const TOUR_TIMEZONE = "Asia/Tokyo";                       // "today" is worked out in this time zone

// ---- After a shake ----
const SHAKE_COOLDOWN = 0.7;  // seconds before another shake can switch the face again
const TAP_CYCLES = false;    // true = a tap/click also switches faces (handy if shaking doesn't work on your device)
const POP_SCALE = 0.025;     // size of the little pop when the face changes (0 = none)
const POP_TILT = 1.2;        // degrees of wobble in that pop
const POP_TIME = 0.35;       // seconds the pop takes to settle

/* ======================= CODE ======================= */

const stage = document.getElementById("stage");
const enableBtn = document.getElementById("enable");
const hint = document.getElementById("hint");
const reduceMotion = matchMedia("(prefers-reduced-motion: reduce)").matches;

const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const TAU = Math.PI * 2;

// Build the layers
const layers = LAYERS.map((cfg, i) => {
  const img = new Image();
  img.alt = "";
  img.draggable = false;
  img.src = cfg.src;
  let el = img, inner = null;
  if (cfg.eye) {
    // wrapper = fixed window that clips to one eye; inner image slides inside it
    el = document.createElement("div");
    el.className = "layer eyewrap";
    el.style.clipPath = cfg.eye.clip;
    el.appendChild(img);
    inner = img;
    el.style.opacity = 0;                 // shown only while its face is showing
  } else {
    img.className = "layer";
    if (cfg.faces) img.style.opacity = 0;
  }
  el.style.transformOrigin = cfg.origin || "50% 50%";
  stage.insertBefore(el, stage.querySelector(".ui"));
  return { id: cfg.id, el, inner, eye: cfg.eye || null, depth: cfg.depth, faces: !!cfg.faces, spot: !!cfg.spot, shift: 0 };
});
const faceLayers = layers.filter(l => l.faces);
const eyeLayerList = layers.filter(l => l.eye);

// Match stage to the first layer's aspect ratio
function setAspect() {
  const first = layers[0].el;
  if (first.naturalWidth) stage.style.setProperty("--ar", first.naturalWidth / first.naturalHeight);
  sizeLayers();
}
layers[0].el.addEventListener("load", setAspect);
if (layers[0].el.complete) setAspect();

// Each layer is enlarged by the distance it can travel, so edges never show.
function sizeLayers() {
  const w = stage.clientWidth;
  const h = stage.clientHeight;
  layers.forEach(l => {
    l.shift = l.depth * MAX_SHIFT * w;
    const pad = l.shift;
    l.el.style.left = -pad + "px";
    l.el.style.top = -pad + "px";
    l.el.style.width = (w + pad * 2) + "px";
    l.el.style.height = (h + pad * 2) + "px";
  });
}
new ResizeObserver(sizeLayers).observe(stage);

/* ---------- Shared motion state ---------- */
let tx = 0, ty = 0, cx = 0, cy = 0;     // tilt target and smoothed tilt (-1..1)
let lastT = null;

/* ---------- Shake energy (speeds up the spotlight) ---------- */
let shakeEnergy = 0;        // 0..1, jumps up with each shake / jolt and decays back down
function addShake(a) { shakeEnergy = Math.min(1, shakeEnergy + a); }

/* ---------- Face switching ---------- */

let faceIndex = 0;
let popStart = -99;
let lastSwitch = -99;       // performance.now()/1000 of the last switch

function showFace(i) {
  faceIndex = i;
  faceLayers.forEach((l, k) => { l.el.style.opacity = k === i ? 1 : 0; });   // only one face visible at a time
  eyeLayerList.forEach(l => { l.el.style.opacity = l.eye.face === i ? 1 : 0; });  // eyes only on their own face
}
showFace(0);

function nextFace() {
  const now = performance.now() / 1000;
  if (now - lastSwitch < SHAKE_COOLDOWN) return;
  lastSwitch = now;
  addShake(0.5);
  const wasPlaying = !audio.paused;           // keep the music going if it was on
  showFace((faceIndex + 1) % faceLayers.length);
  loadTrack(faceIndex, wasPlaying);           // each face has its own song
  if (!reduceMotion) popStart = now;
  if (navigator.vibrate) navigator.vibrate(15);
}

/* ---------- Spotlight: bounce around inside the coloured area ---------- */

const bgImg = layers[0].el;
const spotLayer = layers.find(l => l.spot);
let spotReady = false;
let spotRatio = 1;                         // image height / width, so everything can be measured in image widths
let natX = 0, natY = 0;                    // where the circle sits in the artwork (its centre)
let px = 0, py = 0, vx = 0, vy = 0;        // current centre and velocity
let minX = 0, maxX = 0, minY = 0, maxY = 0;

// Downscale an image and find the box around the pixels that pass a test
function scanBox(img, test) {
  const w = 300, h = Math.max(1, Math.round(w * img.naturalHeight / img.naturalWidth));
  const c = document.createElement("canvas");
  c.width = w; c.height = h;
  const ctx = c.getContext("2d", { willReadFrequently: true });
  ctx.drawImage(img, 0, 0, w, h);
  const d = ctx.getImageData(0, 0, w, h).data;
  let x0 = w, x1 = -1, y0 = h, y1 = -1;
  for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
    const i = (y * w + x) * 4;
    if (test(d[i], d[i + 1], d[i + 2], d[i + 3])) {
      if (x < x0) x0 = x; if (x > x1) x1 = x; if (y < y0) y0 = y; if (y > y1) y1 = y;
    }
  }
  return x1 < 0 ? null : { x0: x0 / w, x1: (x1 + 1) / w, y0: y0 / h, y1: (y1 + 1) / h };
}

function setupSpot() {
  if (!spotLayer) return;
  const spotImg = spotLayer.el;
  spotRatio = bgImg.naturalHeight / bgImg.naturalWidth;
  let g = SPOT_FALLBACK;
  try {
    const b = scanBox(bgImg, (r, gg, bl, a) => a > 128 && r + gg + bl < 740);   // coloured (not white / transparent) area
    const sp = scanBox(spotImg, (r, gg, bl, a) => a > 128);                       // the spotlight circle
    if (b && sp) g = { left: b.x0, right: b.x1, top: b.y0, bottom: b.y1,
                       cx: (sp.x0 + sp.x1) / 2, cy: (sp.y0 + sp.y1) / 2, rx: (sp.x1 - sp.x0) / 2, ry: (sp.y1 - sp.y0) / 2 };
  } catch (e) {
    console.info("Couldn't read the images to measure them (normal when opened from disk). Using SPOT_FALLBACK.");
  }
  natX = g.cx; natY = g.cy * spotRatio;
  minX = g.left + g.rx;   maxX = g.right - g.rx;
  minY = (g.top + g.ry) * spotRatio; maxY = (g.bottom - g.ry) * spotRatio;
  if (minX > maxX) minX = maxX = (minX + maxX) / 2;
  if (minY > maxY) minY = maxY = (minY + maxY) / 2;
  px = clamp(natX, minX, maxX); py = clamp(natY, minY, maxY);
  const ang = (20 + Math.random() * 50) * Math.PI / 180;
  vx = Math.cos(ang) * SPOT_IDLE_SPEED * (Math.random() < 0.5 ? -1 : 1);
  vy = Math.sin(ang) * SPOT_IDLE_SPEED * (Math.random() < 0.5 ? -1 : 1);
  spotReady = true;
}

// Start once the background and the spotlight have both loaded
if (spotLayer) {
  let pending = 2;
  const done = () => { if (--pending === 0) setupSpot(); };
  [bgImg, spotLayer.el].forEach(im => {
    if (im.complete && im.naturalWidth) done(); else im.addEventListener("load", done, { once: true });
  });
}

function updateSpot(dt) {
  shakeEnergy *= Math.exp(-dt / SPOT_SHAKE_DECAY);
  const target = SPOT_IDLE_SPEED * (1 + (SPOT_SHAKE_MULT - 1) * shakeEnergy);   // faster while shaken
  const tilting = Math.hypot(cx, cy) > SPOT_TILT_DEADZONE;
  let s = Math.hypot(vx, vy);

  if (tilting) {
    // tilt pushes it the way you're tilting, like a ball rolling on the screen
    vx += cx * SPOT_TILT_ACCEL * SPOT_TILT_DIR * dt;
    vy += cy * SPOT_TILT_ACCEL * SPOT_TILT_DIR * dt;
    s = Math.hypot(vx, vy);
    if (s > SPOT_TILT_MAX) { vx *= SPOT_TILT_MAX / s; vy *= SPOT_TILT_MAX / s; }
  } else if (s < 1e-4) {
    vx = target; vy = target * 0.6;
  } else {
    // ease toward the idle (or shake-boosted) speed, keeping its direction
    const ns = s + (target - s) * (1 - Math.exp(-dt * SPOT_SPEED_EASE));
    vx *= ns / s; vy *= ns / s;
  }

  px += vx * dt; py += vy * dt;
  const keep = tilting ? SPOT_TILT_BOUNCE : 1;
  if (px < minX) { px = minX; vx = Math.abs(vx) * keep; }
  else if (px > maxX) { px = maxX; vx = -Math.abs(vx) * keep; }
  if (py < minY) { py = minY; vy = Math.abs(vy) * keep; }
  else if (py > maxY) { py = maxY; vy = -Math.abs(vy) * keep; }
}

/* ---------- Eyes: glance around on their own, follow the tilt ---------- */

let gaze = 0;                 // -1 = looking toward the left of the image, +1 = toward the right
let gazeIdle = 0, nextGlance = 1.5, glanceSide = 1;

function updateGaze(t, dt) {
  // neutral: glance from side to side every so often
  if (t >= nextGlance) {
    glanceSide = -glanceSide;
    gazeIdle = Math.random() < EYE_IDLE_CENTER_CHANCE ? 0 : glanceSide * (0.55 + Math.random() * 0.45);
    nextGlance = t + EYE_IDLE_HOLD[0] + Math.random() * (EYE_IDLE_HOLD[1] - EYE_IDLE_HOLD[0]);
  }
  // sideways tilt takes over from the idle glances
  const a = clamp((Math.abs(cx) - EYE_TILT_DEADZONE) / EYE_TILT_BLEND, 0, 1);
  const tiltGaze = clamp(cx * EYE_TILT_GAIN * EYE_DIR, -1, 1);
  const goal = gazeIdle * (1 - a) + tiltGaze * a;
  gaze += (goal - gaze) * (1 - Math.exp(-dt * EYE_FOLLOW));
}

// Slide each eye window's artwork, never past the edges of its own eye
function eyeOffset(l) {
  const e = l.eye;
  return clamp(EYE_SWING * gaze, e.min, e.max);    // 0 = the drawn (centred) position; each eye is held inside its own range
}
function applyEyes() {
  const W = stage.clientWidth;
  for (const l of eyeLayerList) {
    const k = (W + 2 * l.shift) / W || 1;     // the layer is slightly larger than the stage, so scale the travel to match
    l.inner.style.transform = "translate3d(" + (eyeOffset(l) * W * k) + "px,0,0)";
  }
}
new ResizeObserver(() => { if (reduceMotion) applyEyes(); }).observe(stage);   // with reduced motion: hold the eyes at rest

/* ---------- Movement + pop ---------- */

function frame(now) {
  const t = now / 1000;
  const dt = lastT == null ? 0 : Math.min(t - lastT, 0.05);
  lastT = t;
  const W = stage.clientWidth;
  cx += (tx - cx) * SMOOTHING;
  cy += (ty - cy) * SMOOTHING;
  if (spotReady) updateSpot(dt);
  updateGaze(t, dt);
  applyEyes();

  const pp = t - popStart;
  const popping = pp >= 0 && pp < POP_TIME;
  const k = popping ? Math.exp(-pp * 9) : 0;

  for (const l of layers) {
    let dx = -cx * l.shift * DIRECTION;
    let dy = -cy * l.shift * DIRECTION;
    if (l.spot && spotReady) {
      const k = (W + 2 * l.shift) / W;          // the layer is slightly larger than the stage, so scale the travel to match
      dx += (px - natX) * W * k;
      dy += (py - natY) * W * k;
    }
    let rot = 0, sc = 1;
    if ((l.faces || l.eye) && popping) {
      sc = 1 + POP_SCALE * k;
      rot = Math.sin(pp * 40) * POP_TILT * k;
    }
    l.el.style.transform = "translate3d(" + dx + "px," + dy + "px,0) rotate(" + rot + "deg) scale(" + sc + ")";
  }
  requestAnimationFrame(frame);
}
if (!reduceMotion) requestAnimationFrame(frame);

/* ---------- Input: mouse, tilt, shake ---------- */

// Mouse position -> parallax
stage.addEventListener("pointermove", e => {
  if (e.pointerType === "touch" || reduceMotion) return;
  const r = stage.getBoundingClientRect();
  tx = clamp(((e.clientX - r.left) / r.width) * 2 - 1, -1, 1);
  ty = clamp(((e.clientY - r.top) / r.height) * 2 - 1, -1, 1);
});
stage.addEventListener("pointerleave", e => {
  if (e.pointerType !== "touch") { tx = 0; ty = 0; }
});

// Mouse shake: count quick back-and-forth strokes on either axis
const mouseAxes = {
  x: { dir: 0, ext: 0 },
  y: { dir: 0, ext: 0 }
};
let strokes = [];           // timestamps (seconds) of recent strokes

function trackAxis(a, v, t) {
  if (a.dir === 0) { a.dir = 1; a.ext = v; return; }
  // keep following the extreme point in the current direction
  if ((v - a.ext) * a.dir > 0) { a.ext = v; return; }
  // moved the other way far enough = a new stroke
  if (Math.abs(v - a.ext) >= MOUSE_MIN_STROKE) {
    a.dir = -a.dir;
    a.ext = v;
    strokes.push(t);
    addShake(0.22);
  }
}

window.addEventListener("pointermove", e => {
  if (e.pointerType !== "mouse" || reduceMotion) return;
  const t = performance.now() / 1000;
  trackAxis(mouseAxes.x, e.clientX, t);
  trackAxis(mouseAxes.y, e.clientY, t);
  strokes = strokes.filter(s => t - s <= MOUSE_WINDOW);
  if (strokes.length >= MOUSE_STROKES) {
    strokes = [];
    nextFace();
  }
});

// Phone tilt
let base = null;
let gotSensor = false;

function onOrientation(e) {
  if (e.gamma == null || e.beta == null || reduceMotion) return;
  gotSensor = true;
  if (!base) base = { g: e.gamma, b: e.beta };
  tx = clamp((e.gamma - base.g) / TILT_RANGE, -1, 1);
  ty = clamp((e.beta - base.b) / TILT_RANGE, -1, 1);
}

// Phone shake: count sharp jolts in a short window
let lastAcc = null;
let spikes = [];

function onMotion(e) {
  const a = e.accelerationIncludingGravity;
  if (!a || a.x == null) return;
  gotMotion = true;
  if (lastAcc) {
    const jolt = Math.abs(a.x - lastAcc.x) + Math.abs(a.y - lastAcc.y) + Math.abs(a.z - lastAcc.z);
    const t = performance.now() / 1000;
    if (jolt > SHAKE_THRESHOLD) { spikes.push(t); addShake(0.3); }
    spikes = spikes.filter(s => t - s <= SHAKE_WINDOW);
    if (spikes.length >= SHAKE_SPIKES) {
      spikes = [];
      nextFace();
    }
  }
  lastAcc = { x: a.x, y: a.y, z: a.z };
}
let gotMotion = false;

function showHint(text, ms) {
  hint.textContent = text;
  hint.classList.remove("hidden", "fade");
  clearTimeout(showHint.t);
  showHint.t = setTimeout(() => {
    hint.classList.add("fade");
    setTimeout(() => hint.classList.add("hidden"), 700);
  }, ms);
}

function startSensors() {
  window.addEventListener("deviceorientation", onOrientation);
  window.addEventListener("devicemotion", onMotion);
  enableBtn.classList.add("hidden");
  showHint("Shake to change the face and speed up the light. Tilt to steer it. Tap for music, double-tap to reset. Hold for tour dates. Each face has its own song.", 6500);
  setTimeout(() => {
    if (!gotSensor && !gotMotion) showHint("No motion sensor found. Wiggle your mouse over the image.", 4000);
  }, 1500);
}

/* ---------- Music + taps ---------- */

const audio = new Audio();
audio.preload = "metadata";
audio.loop = AUDIO_LOOP;
audio.volume = AUDIO_VOLUME;
let audioFailed = false;
let track = TRACKS[0];
let clipEnd = Infinity;

audio.addEventListener("error", () => {
  audioFailed = true;
  showHint("Couldn't load \"" + track.src + "\". Check the file is in the same folder as this page and the name matches.", 6000);
});
audio.addEventListener("loadedmetadata", () => rewind());   // jump to the clip's start once the file is ready

function rewind() { try { audio.currentTime = track.start || 0; } catch (e) {} audio.volume = AUDIO_VOLUME; }

// Point the player at the song for a face (and optionally keep playing, if the music was on)
function loadTrack(i, autoplay) {
  track = TRACKS[i % TRACKS.length];
  clipEnd = track.length > 0 ? (track.start || 0) + track.length : Infinity;
  audioFailed = false;
  audio.pause();
  audio.src = encodeURI(track.src);
  rewind();
  if (autoplay) {
    const p = audio.play();
    if (p && p.catch) p.catch(() => showHint("Tap to play the new song", 2500));   // some phones need a tap first
  }
}
loadTrack(0, false);

// A clip ends at start + length even though the file is longer: fade out, then stop (or loop)
setInterval(() => {
  if (audio.paused) return;
  const t = audio.currentTime;
  if (t >= clipEnd) {
    if (AUDIO_LOOP) { rewind(); }
    else { audio.pause(); rewind(); showHint("\u21BA Done. Tap to play again", 1500); }
    return;
  }
  const fade = track.fade || 0;
  if (fade > 0 && clipEnd - t < fade) audio.volume = AUDIO_VOLUME * Math.max(0, (clipEnd - t) / fade);
  else if (audio.volume !== AUDIO_VOLUME) audio.volume = AUDIO_VOLUME;
}, 80);

audio.addEventListener("ended", () => {       // a full-length song reaching its end
  if (AUDIO_LOOP) { rewind(); audio.play().catch(() => {}); } else rewind();
});

function togglePlay() {
  if (audio.paused) {
    if (audio.currentTime < (track.start || 0) || audio.currentTime >= clipEnd) rewind();   // always begin inside the clip
    audio.volume = AUDIO_VOLUME;
    const p = audio.play();
    if (p && p.catch) p.catch(() => { if (!audioFailed) showHint("Couldn't play the music on this device.", 3500); });
    showHint("\u25B6 Playing", 900);
  } else {
    audio.pause();
    showHint("\u23F8 Paused", 900);
  }
}

function resetAudio() {
  audio.pause();
  rewind();
  if (DOUBLE_TAP_RESTARTS) {
    const p = audio.play();
    if (p && p.catch) p.catch(() => {});
    showHint("\u21BA Restarted", 1000);
  } else {
    showHint("\u21BA Reset", 1000);
  }
}

/* ---------- Tour schedule sheet (opened by a long press) ---------- */

const sheet = document.getElementById("sheet");
let sheetOpen = false, sheetTimer = null;

function todayISO() {
  const parts = new Intl.DateTimeFormat("en-CA", { timeZone: TOUR_TIMEZONE, year: "numeric", month: "2-digit", day: "2-digit" }).formatToParts(new Date());
  const get = type => (parts.find(p => p.type === type) || {}).value;
  return get("year") + "-" + get("month") + "-" + get("day");
}

function renderSheet() {
  const today = todayISO();
  const legsBox = document.getElementById("legs");
  legsBox.textContent = "";
  let nextMarked = false, upcoming = 0, total = 0;
  TOUR_LEGS.forEach(leg => {
    const h = document.createElement("h3");
    h.textContent = leg.name;
    legsBox.appendChild(h);
    leg.stops.forEach(st => {
      total++;
      const done = st.last < today;
      if (!done) upcoming++;
      const row = document.createElement("div");
      row.className = "stop" + (done ? " done" : "");
      if (!done && !nextMarked) { row.classList.add("next"); nextMarked = true; }
      const d = document.createElement("div"); d.className = "d"; d.textContent = st.date;
      const c = document.createElement("div"); c.className = "c"; c.textContent = st.city;
      const v = document.createElement("div"); v.className = "v"; v.textContent = st.venue;
      row.append(d, c, v);
      legsBox.appendChild(row);
    });
  });
  const banner = document.getElementById("banner");
  banner.textContent = "";
  if (upcoming === 0) {
    const b = document.createElement("b"); b.textContent = "The tour has wrapped. ";
    banner.append(b, "The last show was " + TOUR_FINALE + ". No further dates are announced.");
  } else {
    const b = document.createElement("b"); b.textContent = upcoming + " of " + total + " stops still to come. ";
    banner.append(b, "Past stops are greyed out.");
  }
  document.getElementById("sheetNote").textContent = "Dates are as listed on the tour's Wikipedia page and may change. Check theweeknd.com/tour for the official word.";
}

function openSheet() {
  renderSheet();
  sheet.scrollTop = 0;
  sheet.classList.add("open");
  sheet.setAttribute("aria-hidden", "false");
  sheetOpen = true;
  clearTimeout(sheetTimer);
  if (SHEET_AUTOHIDE > 0) sheetTimer = setTimeout(closeSheet, SHEET_AUTOHIDE * 1000);
}
function closeSheet() {
  sheet.classList.remove("open");
  sheet.setAttribute("aria-hidden", "true");
  sheetOpen = false;
  clearTimeout(sheetTimer);
}
document.getElementById("sheetClose").addEventListener("click", closeSheet);
window.addEventListener("keydown", e => { if (e.key === "Escape") closeSheet(); });

// A tap = press and release without moving much. It is detected on release because phones only allow
// audio to start from a release (not a press).
// A long press (held LONG_PRESS_TIME without moving) opens the tour schedule instead and is never also a tap.
let down = null;
let lastTap = -99;
let holdTimer = null;
function cancelHold() { clearTimeout(holdTimer); holdTimer = null; }

stage.addEventListener("pointerdown", e => {
  if (e.target.closest && e.target.closest(".ui button")) { down = null; return; }
  down = { x: e.clientX, y: e.clientY, id: e.pointerId, long: false };
  cancelHold();
  if (sheetOpen) return;
  const mine = down;
  holdTimer = setTimeout(() => {
    holdTimer = null;
    if (down !== mine) return;
    mine.long = true;
    if (navigator.vibrate) navigator.vibrate(20);
    openSheet();
  }, LONG_PRESS_TIME * 1000);
});
stage.addEventListener("pointermove", e => {
  if (down && !down.long && down.id === e.pointerId && Math.hypot(e.clientX - down.x, e.clientY - down.y) > TAP_MAX_MOVE) cancelHold();
});
stage.addEventListener("pointercancel", () => { cancelHold(); down = null; });
stage.addEventListener("contextmenu", e => e.preventDefault());
stage.addEventListener("pointerup", e => {
  if (!down || down.id !== e.pointerId) return;
  cancelHold();
  const held = down;
  const moved = Math.hypot(e.clientX - held.x, e.clientY - held.y);
  down = null;
  if (held.long) return;                                // it was a long press, not a tap
  if (moved > TAP_MAX_MOVE) return;
  if (sheetOpen) { closeSheet(); return; }              // a tap while the schedule is open just closes it

  const now = performance.now() / 1000;
  if (now - lastTap < DOUBLE_TAP_TIME) {
    // double-tap: reset the music (the first tap of the pair already toggled it, this undoes that)
    lastTap = -99;
    resetAudio();
    if (DOUBLE_TAP_RECENTERS) base = null;
    return;
  }
  lastTap = now;
  togglePlay();
  if (TAP_CYCLES) nextFace();
});

// iOS needs a tap to grant motion access (one prompt covers both tilt and shake)
const needsPermission =
  (typeof DeviceMotionEvent !== "undefined" && typeof DeviceMotionEvent.requestPermission === "function") ||
  (typeof DeviceOrientationEvent !== "undefined" && typeof DeviceOrientationEvent.requestPermission === "function");

const isTouch = matchMedia("(pointer: coarse)").matches;

if (needsPermission) {
  enableBtn.classList.remove("hidden");
  enableBtn.addEventListener("click", async () => {
    try {
      const req = typeof DeviceMotionEvent.requestPermission === "function"
        ? DeviceMotionEvent.requestPermission()
        : DeviceOrientationEvent.requestPermission();
      const result = await req;
      if (result === "granted") {
        startSensors();
      } else {
        enableBtn.classList.add("hidden");
        showHint("Motion access was denied. Reload the page to try again.", 5000);
      }
    } catch (err) {
      showHint("Couldn't enable motion on this page.", 4000);
    }
  });
} else if (isTouch && ("DeviceMotionEvent" in window || "DeviceOrientationEvent" in window)) {
  startSensors();
} else {
  showHint("Wiggle your mouse to change the face and speed up the light. Click for music, double-click to reset. Hold for tour dates.", 5000);
}
</script>
</body>
</html>
